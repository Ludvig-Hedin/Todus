name: Native QA

on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'apps/macos/**'
      - '.github/workflows/native-release.yml'
  workflow_dispatch:

jobs:
  native-qa:
    name: Native QA Checks
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iOS
        run: |
          xcodebuild \
            -project apps/ios/Todus/Todus.xcodeproj \
            -scheme Todus \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build macOS
        run: |
          xcodebuild \
            -project apps/macos/TodusMac.xcodeproj \
            -scheme TodusMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
