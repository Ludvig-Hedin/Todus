name: Todus
options:
  bundleIdPrefix: com.ludvighedin
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: XDBG7P4V96
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: 3
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic

packages:
  CalendarKit:
    url: https://github.com/richardtop/CalendarKit
    exactVersion: "1.1.7"

targets:
  Todus:
    type: application
    platform: iOS
    sources:
      - path: Todus
        excludes:
          - "**/*.md"
          - "**/archived/**"
          - "Services/Auth/AuthService.swift"
      - path: ../../../packages/swift-auth/Sources/TodusAuth
        group: TodusAuth
      - path: ../../../packages/swift-widgets/Sources/TodusWidgetsShared
        group: TodusWidgetsShared
    resources:
      - path: Todus/Resources/Assets.xcassets
      - path: Todus/Resources/Info.plist
        buildPhase: none
      - path: Todus/Resources/TodosConfig.plist
      - path: Todus/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ludvighedin.todus
        INFOPLIST_FILE: Todus/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Todus/Resources/Todus.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: CalendarKit
      - target: TodusWidgets
        embed: true
    entitlements:
      path: Todus/Resources/Todus.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.ludvighedin.todus

  TodusWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../../packages/swift-widgets/Sources/TodusWidgetsShared
      - path: ../../../packages/swift-widgets/Sources/TodusWidgetsExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ludvighedin.todus.widgets
        INFOPLIST_FILE: ../../../packages/swift-widgets/Sources/TodusWidgetsExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../../../packages/swift-widgets/Sources/TodusWidgetsExtension/TodusWidgets.entitlements
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: ../../../packages/swift-widgets/Sources/TodusWidgetsExtension/TodusWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ludvighedin.todus

  TodusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TodusTests
    dependencies:
      - target: Todus

schemes:
  Todus:
    build:
      targets:
        Todus: all
        TodusTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: TodusTests
    analyze:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
