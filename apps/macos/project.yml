name: TodusMac
options:
  bundleIdPrefix: com.ludvighedin
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: XDBG7P4V96
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic

targets:
  TodusMac:
    type: application
    platform: macOS
    sources:
      - path: TodusMac
        excludes:
          - "**/*.md"
          - "App/ConnectionsService.swift"
          - "MacDocsView.swift"
          - "MacMeetingsView.swift"
          - "MacMeetingDetailView.swift"
          - "MeetingsService.swift"
      - path: ../../packages/swift-auth/Sources/TodusAuth
        group: TodusAuth
    resources:
      - path: TodusMac/Resources/Assets.xcassets
      - path: TodusMac/Resources
        excludes:
          - "Info.plist"
          - "Assets.xcassets"
          - "AppIcon.icns"
    dependencies:
      - framework: EventKit.framework
        embed: false
    settings:
      base:
        PRODUCT_NAME: Todus
        PRODUCT_BUNDLE_IDENTIFIER: com.ludvighedin.todus.macos
        INFOPLIST_FILE: TodusMac/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TodusMac/Resources/TodusMac.entitlements
        ENABLE_PREVIEWS: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"

schemes:
  TodusMac:
    build:
      targets:
        TodusMac: all
    run:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
