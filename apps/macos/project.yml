name: TodusMac
options:
  bundleIdPrefix: com.ludvighedin
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: XDBG7P4V96
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic

# MLX local-inference packages. Previously these were added to the project via the
# Xcode UI only, so they were missing from project.yml — any `xcodegen generate`
# silently dropped them and broke the app's Cmlx/_NumericsShims resolution. Declaring
# them here makes the project regen-safe (see MAC-1). Cmlx/_NumericsShims come
# transitively via mlx-swift-examples' MLXLLM/MLXLMCommon products.
packages:
  mlx-swift-examples:
    url: https://github.com/ml-explore/mlx-swift-examples
    majorVersion: 2.29.1

targets:
  TodusMac:
    type: application
    platform: macOS
    sources:
      - path: TodusMac
        excludes:
          - "**/*.md"
          - "App/ConnectionsService.swift"
          - "MacDocsView.swift"
          - "MacMeetingsView.swift"
          - "MacMeetingDetailView.swift"
          - "MeetingsService.swift"
      - path: ../../packages/swift-auth/Sources/TodusAuth
        group: TodusAuth
      - path: ../../packages/swift-widgets/Sources/TodusWidgetsShared
        group: TodusWidgetsShared
    resources:
      - path: TodusMac/Resources/Assets.xcassets
      - path: TodusMac/Resources
        excludes:
          - "Info.plist"
          - "Assets.xcassets"
    dependencies:
      - framework: EventKit.framework
        embed: false
      - target: TodusMacWidgets
        embed: true
      - package: mlx-swift-examples
        product: MLXLLM
      - package: mlx-swift-examples
        product: MLXLMCommon
    settings:
      base:
        PRODUCT_NAME: Todus
        PRODUCT_BUNDLE_IDENTIFIER: com.ludvighedin.todus.macos
        INFOPLIST_FILE: TodusMac/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TodusMac/Resources/TodusMac.entitlements
        ENABLE_PREVIEWS: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
    entitlements:
      path: TodusMac/Resources/TodusMac.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ludvighedin.todus
        com.apple.security.device.audio-input: true

  TodusMacWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: ../../packages/swift-widgets/Sources/TodusWidgetsShared
      - path: ../../packages/swift-widgets/Sources/TodusWidgetsExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ludvighedin.todus.macos.widgets
        INFOPLIST_FILE: ../../packages/swift-widgets/Sources/TodusWidgetsExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../../packages/swift-widgets/Sources/TodusWidgetsExtension/TodusMacWidgets.entitlements
        ENABLE_PREVIEWS: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
    entitlements:
      path: ../../packages/swift-widgets/Sources/TodusWidgetsExtension/TodusMacWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ludvighedin.todus

  TodusMacTests:
    type: bundle.unit-test
    platform: macOS
    # Standalone (host-less) logic-test bundle: compiles the Foundation-only decode
    # types directly instead of `@testable import`-ing the MLX-linked host app. The
    # testable host rebuild couldn't resolve MLX's Cmlx/_NumericsShims C modules
    # (MAC-1); a pure-logic decode test doesn't need the app at all. Add more
    # Foundation-only sources here if future tests need them.
    sources:
      - path: TodusMacTests
      - path: TodusMac/Domain/EmailModels.swift
      - path: TodusMac/Domain/EmailThreadResponse.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ludvighedin.todus.macos.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"

schemes:
  TodusMac:
    build:
      targets:
        TodusMac: all
    run:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
  # Dedicated scheme so `xcodebuild test -scheme TodusMacTests` builds ONLY the
  # standalone test bundle (Foundation-only sources) and never the MLX-linked app —
  # avoiding the Cmlx/_NumericsShims resolution failure in the test build context.
  TodusMacTests:
    build:
      targets:
        TodusMacTests: [test]
    test:
      config: Debug
      targets:
        - TodusMacTests
