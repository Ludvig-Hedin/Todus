name: TodusMac
options:
  bundleIdPrefix: com.ludvighedin
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: XDBG7P4V96
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic

targets:
  TodusMac:
    type: application
    platform: macOS
    sources:
      - path: TodusMac
        excludes:
          - "**/*.md"
          - "App/ConnectionsService.swift"
          - "MacDocsView.swift"
          - "MacMeetingsView.swift"
          - "MacMeetingDetailView.swift"
          - "MeetingsService.swift"
      - path: ../../packages/swift-auth/Sources/TodusAuth
        group: TodusAuth
      - path: ../../packages/swift-widgets/Sources/TodusWidgetsShared
        group: TodusWidgetsShared
    resources:
      - path: TodusMac/Resources/Assets.xcassets
      - path: TodusMac/Resources
        excludes:
          - "Info.plist"
          - "Assets.xcassets"
    dependencies:
      - framework: EventKit.framework
        embed: false
      - target: TodusMacWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: Todus
        PRODUCT_BUNDLE_IDENTIFIER: com.ludvighedin.todus.macos
        INFOPLIST_FILE: TodusMac/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TodusMac/Resources/TodusMac.entitlements
        ENABLE_PREVIEWS: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
    entitlements:
      path: TodusMac/Resources/TodusMac.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ludvighedin.todus
        com.apple.security.device.audio-input: true

  TodusMacWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: ../../packages/swift-widgets/Sources/TodusWidgetsShared
      - path: ../../packages/swift-widgets/Sources/TodusWidgetsExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ludvighedin.todus.macos.widgets
        INFOPLIST_FILE: ../../packages/swift-widgets/Sources/TodusWidgetsExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../../packages/swift-widgets/Sources/TodusWidgetsExtension/TodusMacWidgets.entitlements
        ENABLE_PREVIEWS: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
    entitlements:
      path: ../../packages/swift-widgets/Sources/TodusWidgetsExtension/TodusMacWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ludvighedin.todus

  TodusMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TodusMacTests
    dependencies:
      - target: TodusMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ludvighedin.todus.macos.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        # The host app's PRODUCT_NAME is "Todus" (not the target name "TodusMac"),
        # so the built product is Todus.app — point TEST_HOST/BUNDLE_LOADER at it.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Todus.app/Contents/MacOS/Todus"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TodusMac:
    build:
      targets:
        TodusMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TodusMacTests
    analyze:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
